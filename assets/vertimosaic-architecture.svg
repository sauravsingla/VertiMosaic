<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">VertiMosaic Architecture</title>
  <desc id="desc">Animated architecture of the current VertiMosaic vertical federated learning implementation. Raw feature matrices stay party-local. Animated messages show local logits, residual signals, gradients and Hessians, and aggregate candidate metadata.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #182644; }
      .muted { fill: #5b6980; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 14px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .title { font-size: 32px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #d6dfeb; stroke-width: 2; }
      .blueCard { fill: #ffffff; stroke: #b7cff8; stroke-width: 2; }
      .orangeCard { fill: #ffffff; stroke: #f4cb93; stroke-width: 2; }
      .neutralPath { fill: none; stroke: #d2dbe7; stroke-width: 3; }
      .bluePath { fill: none; stroke: #2d70ee; stroke-width: 4; }
      .purplePath { fill: none; stroke: #8449e0; stroke-width: 4; }
      .orangePath { fill: none; stroke: #eb861f; stroke-width: 4; }
      .greenPath { fill: none; stroke: #20ab60; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#23395d" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#fafcff"/>
  <text x="600" y="42" text-anchor="middle" class="title">VertiMosaic Architecture</text>
  <text x="600" y="70" text-anchor="middle" class="body muted">Current CPU-first vertical federated learning implementation</text>

  <g opacity="1">
    <rect x="390" y="92" width="420" height="38" rx="19" fill="#f4f7fb" stroke="#e6ecf4"/>
    <circle cx="415" cy="111" r="10" fill="#2d70ee"/>
    <path d="M412 105 L412 117 L420 111 Z" fill="#fff"/>
  </g>
  <g>
    <text x="600" y="116" text-anchor="middle" class="label" fill="#2d70ee">1/4  Local logits → active party
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.24;0.25;0.99;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="116" text-anchor="middle" class="label" fill="#8449e0" opacity="0">2/4  Residual signal → passive parties
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.50;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="116" text-anchor="middle" class="label" fill="#eb861f" opacity="0">3/4  Gradients + Hessians → passive parties
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.74;0.75;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="116" text-anchor="middle" class="label" fill="#20ab60" opacity="0">4/4  Candidate metadata → active party
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.99;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="145" width="270" height="100" rx="16" class="card"/>
    <rect x="30" y="265" width="270" height="100" rx="16" class="card"/>
    <rect x="30" y="385" width="270" height="100" rx="16" class="card"/>
    <rect x="30" y="505" width="270" height="100" rx="16" class="card"/>
  </g>

  <circle cx="68" cy="195" r="22" fill="#eaf2ff"/><text x="68" y="202" text-anchor="middle" class="heading" fill="#2d70ee">B</text>
  <circle cx="68" cy="315" r="22" fill="#f2ebff"/><text x="68" y="322" text-anchor="middle" class="heading" fill="#8449e0">T</text>
  <circle cx="68" cy="435" r="22" fill="#eaf9f0"/><text x="68" y="442" text-anchor="middle" class="heading" fill="#20ab60">I</text>
  <circle cx="68" cy="555" r="22" fill="#fff2e3"/><text x="68" y="562" text-anchor="middle" class="heading" fill="#eb861f">R</text>

  <text x="104" y="174" class="heading">Bank</text>
  <rect x="220" y="157" width="62" height="23" rx="12" fill="#eaf2ff"/>
  <text x="251" y="173" text-anchor="middle" class="small" font-weight="700" fill="#2d70ee">ACTIVE</text>
  <text x="104" y="202" class="body muted">Features + binary target</text>
  <text x="104" y="228" class="small" font-weight="700" fill="#da4545">Raw data stays local</text>

  <text x="104" y="294" class="heading">Telecom</text>
  <rect x="214" y="277" width="68" height="23" rx="12" fill="#f4f7fb"/>
  <text x="248" y="293" text-anchor="middle" class="small" font-weight="700" fill="#5b6980">PASSIVE</text>
  <text x="104" y="322" class="body muted">Complementary feature columns</text>
  <text x="104" y="348" class="small" font-weight="700" fill="#da4545">Raw data stays local</text>

  <text x="104" y="414" class="heading">Insurance</text>
  <rect x="214" y="397" width="68" height="23" rx="12" fill="#f4f7fb"/>
  <text x="248" y="413" text-anchor="middle" class="small" font-weight="700" fill="#5b6980">PASSIVE</text>
  <text x="104" y="442" class="body muted">Complementary feature columns</text>
  <text x="104" y="468" class="small" font-weight="700" fill="#da4545">Raw data stays local</text>

  <text x="104" y="534" class="heading">Retail</text>
  <rect x="214" y="517" width="68" height="23" rx="12" fill="#f4f7fb"/>
  <text x="248" y="533" text-anchor="middle" class="small" font-weight="700" fill="#5b6980">PASSIVE</text>
  <text x="104" y="562" class="body muted">Complementary feature columns</text>
  <text x="104" y="588" class="small" font-weight="700" fill="#da4545">Raw data stays local</text>

  <rect x="430" y="195" width="345" height="375" rx="22" class="blueCard" filter="url(#shadow)"/>
  <g fill="#2d70ee">
    <rect x="575" y="225" width="54" height="12" rx="4"/>
    <rect x="575" y="242" width="54" height="12" rx="4"/>
    <rect x="575" y="259" width="54" height="12" rx="4"/>
  </g>
  <text x="602" y="309" text-anchor="middle" class="heading">VFL Coordinator</text>
  <text x="602" y="336" text-anchor="middle" class="body muted">Party-local compute • in-process simulator</text>
  <line x1="470" y1="359" x2="735" y2="359" stroke="#e1e7ef" stroke-width="2"/>

  <circle cx="480" cy="389" r="10" fill="#2d70ee"/><text x="480" y="394" text-anchor="middle" class="small" fill="#fff" font-weight="700">1</text>
  <text x="505" y="394" class="label">Local logits</text><text x="625" y="394" class="small muted">passive → active</text>
  <circle cx="480" cy="423" r="10" fill="#e8edf4"/><text x="480" y="428" text-anchor="middle" class="small muted" font-weight="700">2</text>
  <text x="505" y="428" class="label muted">Residual signal</text><text x="625" y="428" class="small muted">active → passive</text>
  <circle cx="480" cy="457" r="10" fill="#e8edf4"/><text x="480" y="462" text-anchor="middle" class="small muted" font-weight="700">3</text>
  <text x="505" y="462" class="label muted">Local gradients</text><text x="625" y="462" class="small muted">computed by each party</text>
  <circle cx="480" cy="491" r="10" fill="#e8edf4"/><text x="480" y="496" text-anchor="middle" class="small muted" font-weight="700">4</text>
  <text x="505" y="496" class="label muted">Party weights</text><text x="625" y="496" class="small muted">updated by protocol</text>

  <rect x="470" y="526" width="265" height="30" rx="10" fill="#f4f7fb" stroke="#e9edf3"/>
  <text x="602" y="546" text-anchor="middle" class="small muted">InMemoryTransport records message metadata</text>

  <rect x="835" y="170" width="335" height="175" rx="18" class="blueCard" filter="url(#shadow)"/>
  <text x="860" y="204" class="heading" fill="#2d70ee">VFLLogisticRegression</text>
  <text x="860" y="239" class="small">• Local logits → active party</text>
  <text x="860" y="266" class="small">• Residual signal → passive parties</text>
  <text x="860" y="293" class="small">• Party-local gradient computation</text>
  <text x="860" y="320" class="small">• Party-specific weight updates</text>

  <rect x="835" y="370" width="335" height="200" rx="18" class="orangeCard" filter="url(#shadow)"/>
  <text x="860" y="404" class="heading" fill="#eb861f">VFLHistGBDT</text>
  <text x="860" y="439" class="small">• Gradients + Hessians → passive parties</text>
  <text x="860" y="466" class="small">• Local histogram candidates</text>
  <text x="860" y="493" class="small">• Aggregate candidate metadata → active party</text>
  <text x="860" y="520" class="small">• Opaque threshold + local routing</text>
  <text x="860" y="547" class="small">• Raw feature matrices stay local</text>

  <path id="tIn" d="M300 315 C360 315 385 325 430 330" class="neutralPath"/>
  <path id="iIn" d="M300 435 C360 435 385 400 430 395" class="neutralPath"/>
  <path id="rIn" d="M300 555 C360 555 385 490 430 460" class="neutralPath"/>
  <path id="tOut" d="M430 330 C385 325 360 315 300 315" fill="none"/>
  <path id="iOut" d="M430 395 C385 400 360 435 300 435" fill="none"/>
  <path id="rOut" d="M430 460 C385 490 360 555 300 555" fill="none"/>
  <line x1="300" y1="195" x2="430" y2="250" stroke="#bac6d6" stroke-width="2"/>

  <g fill="#2d70ee" opacity="0">
    <circle r="7"><animateMotion dur="1.25s" begin="0s;6s" repeatCount="1"><mpath xlink:href="#tIn"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="0.12s;6.12s" repeatCount="1"><mpath xlink:href="#iIn"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="0.24s;6.24s" repeatCount="1"><mpath xlink:href="#rIn"/></animateMotion></circle>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g fill="#8449e0" opacity="0">
    <circle r="7"><animateMotion dur="1.25s" begin="1.5s;7.5s" repeatCount="1"><mpath xlink:href="#tOut"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="1.62s;7.62s" repeatCount="1"><mpath xlink:href="#iOut"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="1.74s;7.74s" repeatCount="1"><mpath xlink:href="#rOut"/></animateMotion></circle>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.50;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g fill="#eb861f" opacity="0">
    <circle r="7"><animateMotion dur="1.25s" begin="3s;9s" repeatCount="1"><mpath xlink:href="#tOut"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="3.12s;9.12s" repeatCount="1"><mpath xlink:href="#iOut"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="3.24s;9.24s" repeatCount="1"><mpath xlink:href="#rOut"/></animateMotion></circle>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.74;0.75;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g fill="#20ab60" opacity="0">
    <circle r="7"><animateMotion dur="1.25s" begin="4.5s;10.5s" repeatCount="1"><mpath xlink:href="#tIn"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="4.62s;10.62s" repeatCount="1"><mpath xlink:href="#iIn"/></animateMotion></circle>
    <circle r="7"><animateMotion dur="1.25s" begin="4.74s;10.74s" repeatCount="1"><mpath xlink:href="#rIn"/></animateMotion></circle>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.99;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <rect x="30" y="625" width="1140" height="50" rx="14" class="card"/>
  <text x="600" y="648" text-anchor="middle" class="label">Supporting capabilities</text>
  <text x="600" y="666" text-anchor="middle" class="small muted">Alignment &amp; linkage • Evaluation • Contribution • Overlap • Dropout • Drift • Provenance</text>
</svg>
