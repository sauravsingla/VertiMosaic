<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VertiMosaic interactive VFL evidence explorer preview</title>
  <desc id="desc">Preview of the VertiMosaic Hugging Face Space with a modern hero, guided benchmark questions, live evidence cards and interactive model comparison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101e"/><stop offset="1" stop-color="#0d1930"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263866"/><stop offset="0.52" stop-color="#111d34"/><stop offset="1" stop-color="#143341"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b91ff"/><stop offset="1" stop-color="#51d8ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="70" cy="40" r="240" fill="#6677ff" opacity=".10"/>
  <circle cx="1130" cy="300" r="260" fill="#51d8ca" opacity=".06"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="42" y="30" width="1116" height="64" rx="18" fill="#0d1729" stroke="#273b61"/>
    <rect x="62" y="43" width="38" height="38" rx="12" fill="#162643" stroke="#466091"/>
    <text x="72" y="69" font-size="20">🧩</text>
    <text x="114" y="57" fill="#f4f7ff" font-size="16" font-weight="800">VertiMosaic</text>
    <text x="114" y="75" fill="#8fa2c3" font-size="11">VFL Research Explorer</text>
    <rect x="845" y="45" width="84" height="34" rx="11" fill="#111e34" stroke="#31486e"/><text x="869" y="67" fill="#d9e2f3" font-size="12" font-weight="700">GitHub</text>
    <rect x="939" y="45" width="94" height="34" rx="11" fill="#111e34" stroke="#31486e"/><text x="957" y="67" fill="#d9e2f3" font-size="12" font-weight="700">Dataset</text>
    <rect x="1043" y="45" width="95" height="34" rx="11" fill="#5966e8"/><text x="1059" y="67" fill="#fff" font-size="12" font-weight="800">Evidence ↓</text>

    <rect x="42" y="110" width="1116" height="258" rx="28" fill="url(#hero)" stroke="#31486e" filter="url(#shadow)"/>
    <circle cx="73" cy="145" r="5" fill="#72e0a0"/><text x="88" y="150" fill="#64ded0" font-size="11" font-weight="800" letter-spacing="1.4">REPRODUCIBLE VERTICAL FEDERATED LEARNING EVIDENCE</text>
    <text x="72" y="205" fill="#f4f7ff" font-size="37" font-weight="850">See what changes when the</text>
    <text x="72" y="247" fill="#f4f7ff" font-size="37" font-weight="850">data stays distributed.</text>
    <text x="72" y="280" fill="#aebed5" font-size="14">Quality · party contribution · overlap · dropout · drift · communication · provenance</text>
    <rect x="72" y="306" width="158" height="39" rx="12" fill="#6974ef"/><text x="92" y="331" fill="#fff" font-size="13" font-weight="800">Explore benchmark →</text>
    <rect x="240" y="306" width="144" height="39" rx="12" fill="#111e34" stroke="#3a527b"/><text x="260" y="331" fill="#e6ecf8" font-size="13" font-weight="700">60-second tour</text>

    <g transform="translate(770,137)">
      <rect x="0" y="0" width="145" height="84" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/><text x="17" y="27" font-size="19">📈</text><text x="17" y="49" fill="#f4f7ff" font-size="12" font-weight="800">Model quality</text><text x="17" y="68" fill="#9fb0cc" font-size="10">AUC · F1 · calibration</text>
      <rect x="158" y="16" width="145" height="84" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/><text x="175" y="43" font-size="19">🏢</text><text x="175" y="65" fill="#f4f7ff" font-size="12" font-weight="800">Party views</text><text x="175" y="84" fill="#9fb0cc" font-size="10">Bank · Telecom · more</text>
      <rect x="0" y="99" width="145" height="84" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/><text x="17" y="126" font-size="19">🔗</text><text x="17" y="148" fill="#f4f7ff" font-size="12" font-weight="800">Robustness</text><text x="17" y="167" fill="#9fb0cc" font-size="10">Overlap · dropout · drift</text>
      <rect x="158" y="115" width="145" height="84" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/><text x="175" y="142" font-size="19">🧪</text><text x="175" y="164" fill="#f4f7ff" font-size="12" font-weight="800">Provenance</text><text x="175" y="183" fill="#9fb0cc" font-size="10">Commit · seed · systems</text>
    </g>

    <g>
      <rect x="42" y="386" width="205" height="76" rx="16" fill="#0f1b30" stroke="#273b61"/><text x="62" y="416" fill="#f4f7ff" font-size="20" font-weight="850">2,000</text><text x="62" y="439" fill="#93a5c2" font-size="11">core benchmark rows</text>
      <rect x="258" y="386" width="205" height="76" rx="16" fill="#0f1b30" stroke="#273b61"/><text x="278" y="416" fill="#f4f7ff" font-size="20" font-weight="850">42</text><text x="278" y="439" fill="#93a5c2" font-size="11">fixed experiment seed</text>
      <rect x="474" y="386" width="205" height="76" rx="16" fill="#0f1b30" stroke="#273b61"/><text x="494" y="416" fill="#f4f7ff" font-size="20" font-weight="850">4</text><text x="494" y="439" fill="#93a5c2" font-size="11">synthetic party roles</text>
      <rect x="690" y="386" width="205" height="76" rx="16" fill="#0f1b30" stroke="#273b61"/><text x="710" y="416" fill="#72e0a0" font-size="20" font-weight="850">NO</text><text x="710" y="439" fill="#93a5c2" font-size="11">raw feature pooling</text>
      <rect x="906" y="386" width="252" height="76" rx="16" fill="#0f1b30" stroke="#273b61"/><text x="926" y="416" fill="#f4f7ff" font-size="20" font-weight="850">CPU</text><text x="926" y="439" fill="#93a5c2" font-size="11">reference execution</text>
    </g>

    <text x="42" y="500" fill="#f4f7ff" font-size="21" font-weight="850">Interactive evidence explorer</text>
    <text x="42" y="521" fill="#8fa2c3" font-size="11">Switch metrics, compare experiment families, inspect provenance and download the generated evidence.</text>
    <g font-size="11" font-weight="800">
      <rect x="42" y="542" width="145" height="34" rx="11" fill="#1a2949" stroke="#8b91ff"/><text x="61" y="564" fill="#f4f7ff">📊 Model comparison</text>
      <rect x="197" y="542" width="150" height="34" rx="11" fill="#0f1b30" stroke="#273b61"/><text x="217" y="564" fill="#aebed5">🏢 Party contribution</text>
      <rect x="357" y="542" width="132" height="34" rx="11" fill="#0f1b30" stroke="#273b61"/><text x="377" y="564" fill="#aebed5">🔗 Entity overlap</text>
      <rect x="499" y="542" width="132" height="34" rx="11" fill="#0f1b30" stroke="#273b61"/><text x="519" y="564" fill="#aebed5">⚡ Party dropout</text>
      <rect x="641" y="542" width="125" height="34" rx="11" fill="#0f1b30" stroke="#273b61"/><text x="661" y="564" fill="#aebed5">🌊 Feature drift</text>
      <rect x="776" y="542" width="176" height="34" rx="11" fill="#0f1b30" stroke="#273b61"/><text x="796" y="564" fill="#aebed5">🧪 Systems &amp; provenance</text>
    </g>
    <rect x="972" y="535" width="186" height="49" rx="14" fill="#0f1b30" stroke="#273b61"/><rect x="987" y="550" width="107" height="10" rx="5" fill="url(#accent)"/><text x="1107" y="563" fill="#d9e2f3" font-size="10" font-weight="800">0.7872</text>
  </g>
</svg>
