name: Verify PyPI and add badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pypi-and-badge-once.yml'

permissions:
  contents: write

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify clean install from PyPI
        shell: bash
        run: |
          python -m venv /tmp/vertimosaic-pypi
          /tmp/vertimosaic-pypi/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if /tmp/vertimosaic-pypi/bin/python -m pip install --no-cache-dir "vertimosaic==0.1.0"; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "PyPI package did not become installable in time" >&2
              exit 1
            fi
            sleep 10
          done
          cd /tmp
          /tmp/vertimosaic-pypi/bin/python -c "import vertimosaic; print('vertimosaic import OK')"
          /tmp/vertimosaic-pypi/bin/vertimosaic --help >/dev/null
          /tmp/vertimosaic-pypi/bin/python -m pip show vertimosaic

      - name: Add PyPI badge and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          badge = '  <a href="https://pypi.org/project/vertimosaic/"><img src="https://img.shields.io/pypi/v/vertimosaic" alt="PyPI version"></a>\n'
          anchor = '  <a href="https://github.com/sauravsingla/VertiMosaic/actions/workflows/package.yml"><img src="https://github.com/sauravsingla/VertiMosaic/actions/workflows/package.yml/badge.svg?branch=main" alt="Package"></a>\n'
          if badge not in text:
              if anchor not in text:
                  raise SystemExit('README badge anchor not found')
              text = text.replace(anchor, anchor + badge, 1)
              readme.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/verify-pypi-and-badge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/verify-pypi-and-badge-once.yml
          git commit -m "docs: add VertiMosaic PyPI badge"
          git push origin HEAD:main
