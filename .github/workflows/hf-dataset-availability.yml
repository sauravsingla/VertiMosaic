# SPDX-License-Identifier: Apache-2.0
name: Hugging Face dataset availability

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "Number of metadata availability checks (1-900)"
        required: true
        default: "900"
      delay_seconds:
        description: "Base delay between checks; minimum is 3 seconds"
        required: true
        default: "3.0"

permissions:
  contents: read

concurrency:
  group: vertimosaic-hf-dataset-availability
  cancel-in-progress: false

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run rate-limited metadata availability test
        run: >-
          python scripts/hf_dataset_availability_check.py
          --requests "${{ inputs.requests }}"
          --delay "${{ inputs.delay_seconds }}"
          --output hf_availability.csv
          --summary hf_availability_summary.json

      - name: Add result summary
        if: always()
        shell: bash
        run: |
          if [[ -f hf_availability_summary.json ]]; then
            echo '## Hugging Face dataset availability' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat hf_availability_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload availability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hf-dataset-availability-${{ github.run_id }}
          path: |
            hf_availability.csv
            hf_availability_summary.json
          if-no-files-found: warn
          retention-days: 30
