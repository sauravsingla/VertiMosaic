# SPDX-License-Identifier: Apache-2.0
name: MovieLens exact-linked benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 2"
  pull_request:
    paths:
      - "src/vertimosaic/experiments/linked_movielens.py"
      - "tests/test_movielens_linked.py"
      - ".github/workflows/movielens-linked-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_movielens_linked.py
      - name: Run provider-backed exact multi-table benchmark
        run: >-
          vertimosaic-linked-movielens
          --seed 42
          --bootstrap-replicates 100
          --output reports/movielens_1m_exact_linked.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movielens-1m-exact-linked-evidence
          path: reports/movielens_1m_exact_linked*
          if-no-files-found: error
          retention-days: 30
