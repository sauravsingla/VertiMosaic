# SPDX-License-Identifier: Apache-2.0
name: Optional crypto backends

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,privacy-crypto]"
      - run: pytest -q tests/test_crypto_backends.py tests/test_privacy_backends.py
      - name: OpenMined PSI smoke
        run: |
          python - <<'PY'
          from vertimosaic.privacy import OpenMinedPSIBackend
          result = OpenMinedPSIBackend().intersection(["a", "b", "c"], ["b", "c", "d"])
          assert set(result) == {"b", "c"}
          PY
      - name: Paillier homomorphic sum smoke
        run: |
          python - <<'PY'
          import numpy as np
          from vertimosaic.privacy import PaillierHomomorphicSum
          result = PaillierHomomorphicSum(key_bits=512).sum(
              [np.array([1, -2]), np.array([4, 5])]
          )
          assert np.array_equal(np.asarray(result, dtype=np.int64), np.array([5, 3]))
          PY
