name: Publish VertiMosaic Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hf-space/**'
      - 'huggingface/build_space.py'
      - 'src/vertimosaic/experiments/**'
      - 'src/vertimosaic/datasets/synthetic.py'
      - 'src/vertimosaic/models/**'
      - 'src/vertimosaic/evaluation/**'
      - 'src/vertimosaic/parties/**'
      - 'src/vertimosaic/privacy/**'
      - '.github/workflows/publish-space.yml'
      - 'pyproject.toml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: vertimosaic-huggingface-space
  cancel-in-progress: true

jobs:
  publish-space:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install VertiMosaic
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build Space evidence payload
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python huggingface/build_space.py --output hf-space/data.json
          test -s hf-space/data.json

      - name: Validate Space provenance and claim boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("hf-space/data.json").read_text(encoding="utf-8"))
          if payload.get("source_commit") != "${{ github.sha }}":
              raise SystemExit("Space source_commit does not match publishing SHA")

          benchmark = payload.get("benchmark", {})
          if benchmark.get("raw_feature_tables_pooled") is not False:
              raise SystemExit("Space must preserve raw-feature locality boundary")
          if benchmark.get("source_type") != "fully_synthetic":
              raise SystemExit("Space core benchmark must remain fully_synthetic")

          privacy = str(payload.get("privacy_boundary", ""))
          for phrase in ("no cryptographic privacy guarantee", "formal differential privacy"):
              if phrase not in privacy:
                  raise SystemExit(f"Space privacy boundary missing: {phrase}")

          external = str(payload.get("external_data_boundary", ""))
          if "No UCI, OpenML or IEEE-CIS source rows are redistributed" not in external:
              raise SystemExit("Space external-data boundary is missing")

          links = payload.get("links", {})
          if links.get("dataset") != "https://huggingface.co/datasets/sauravsingla08/VertiMosaic-VFL-Benchmark":
              raise SystemExit("Space dataset cross-link is incorrect")
          if links.get("github") != "https://github.com/sauravsingla/VertiMosaic":
              raise SystemExit("Space GitHub cross-link is incorrect")

          print("Validated VertiMosaic Space provenance and claim boundaries")
          PY

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish Space to Hugging Face
        env:
          HF_OIDC_RESOURCE: spaces/sauravsingla08/VertiMosaic
        run: |
          hf upload spaces/sauravsingla08/VertiMosaic hf-space . \
            --commit-message "Sync VertiMosaic Space from GitHub ${GITHUB_SHA::7}"
