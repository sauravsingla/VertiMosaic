name: Security
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -r src -q
      - name: Audit installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pip-audit; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "pip-audit failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "pip-audit attempt ${attempt} failed; retrying transient service/network errors." >&2
            sleep $((attempt * 5))
          done
      - name: Build SBOM
        run: cyclonedx-py environment --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
