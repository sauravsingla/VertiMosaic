name: Security
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bandit -r src
      - run: pip-audit
