name: Publish VertiMosaic Hugging Face Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dataset.yml'
      - 'huggingface/**'
      - 'src/vertimosaic/experiments/**'
      - 'src/vertimosaic/datasets/synthetic.py'
      - 'src/vertimosaic/models/**'
      - 'src/vertimosaic/evaluation/**'
      - 'src/vertimosaic/parties/**'
      - 'src/vertimosaic/privacy/**'
      - 'DATA_LICENSES.md'
      - 'pyproject.toml'

permissions:
  id-token: write
  contents: read

jobs:
  publish-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install VertiMosaic
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build Hugging Face dataset package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python huggingface/build_dataset.py --output hf-dataset
          find hf-dataset -maxdepth 3 -type f -print | sort

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish dataset to Hugging Face
        env:
          HF_OIDC_RESOURCE: datasets/sauravsingla08/VertiMosaic-VFL-Benchmark
        run: |
          hf upload datasets/sauravsingla08/VertiMosaic-VFL-Benchmark hf-dataset . \
            --commit-message "Sync VertiMosaic VFL benchmark from GitHub ${GITHUB_SHA::7}"
