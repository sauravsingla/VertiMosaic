name: Publish VertiMosaic Hugging Face Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dataset.yml'
      - 'huggingface/**'
      - 'src/vertimosaic/experiments/**'
      - 'src/vertimosaic/datasets/synthetic.py'
      - 'src/vertimosaic/models/**'
      - 'src/vertimosaic/evaluation/**'
      - 'src/vertimosaic/parties/**'
      - 'src/vertimosaic/privacy/**'
      - 'DATA_LICENSES.md'
      - 'pyproject.toml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: vertimosaic-huggingface-dataset
  cancel-in-progress: true

jobs:
  publish-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install VertiMosaic
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build Hugging Face dataset package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python huggingface/build_dataset.py --output hf-dataset
          find hf-dataset -maxdepth 3 -type f -print | sort

      - name: Validate Dataset Viewer configurations and provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import pyarrow as pa
          import pyarrow.parquet as pq

          # Keep Parquet validation single-threaded. This avoids an Arrow worker-pool
          # teardown crash that can occur after successful reads during interpreter
          # shutdown on Linux CI runners.
          pa.set_cpu_count(1)

          root = Path("hf-dataset")
          expected = {
              "core-model-comparison": root / "data" / "core_model_comparison.parquet",
              "party-ablation": root / "data" / "party_ablation.parquet",
              "partial-overlap": root / "data" / "partial_overlap.parquet",
              "party-dropout": root / "data" / "party_dropout.parquet",
              "feature-drift": root / "data" / "feature_drift.parquet",
          }
          missing_files = [name for name, path in expected.items() if not path.is_file()]
          if missing_files:
              raise SystemExit(f"missing canonical Viewer files: {missing_files}")

          source_sha = "${{ github.sha }}"
          for name, path in expected.items():
              table = pq.read_table(path, use_threads=False)
              if table.num_rows == 0:
                  raise SystemExit(f"{name} is empty")
              if "source_commit" not in table.column_names:
                  raise SystemExit(f"{name} lacks source_commit")
              source_commits = {str(value) for value in table.column("source_commit").to_pylist()}
              if source_commits != {source_sha}:
                  raise SystemExit(f"{name} source_commit does not match publishing SHA")
              if "raw_features_pooled" not in table.column_names:
                  raise SystemExit(f"{name} lacks raw_features_pooled boundary")
              if any(bool(value) for value in table.column("raw_features_pooled").to_pylist()):
                  raise SystemExit(f"{name} unexpectedly marks pooled raw features")

          manifest = json.loads((root / "summaries" / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("source_commit") != source_sha:
              raise SystemExit("manifest source_commit does not match publishing SHA")
          if manifest.get("external_source_rows_included") is not False:
              raise SystemExit("external source rows must not be redistributed")
          if manifest.get("ieee_cis_rows_included") is not False:
              raise SystemExit("IEEE-CIS rows must not be redistributed")
          if manifest.get("raw_feature_tables_pooled") is not False:
              raise SystemExit("raw feature tables must not be marked pooled")

          card = (root / "README.md").read_text(encoding="utf-8")
          required_card_fragments = [
              "pretty_name: VertiMosaic VFL Benchmark",
              "default: true",
              "path: data/core_model_comparison.parquet",
              "path: data/party_ablation.parquet",
              "path: data/partial_overlap.parquet",
              "path: data/party_dropout.parquet",
              "path: data/feature_drift.parquet",
              "https://huggingface.co/spaces/sauravsingla08/VertiMosaic",
              "does **not** claim cryptographic security",
          ]
          missing = [fragment for fragment in required_card_fragments if fragment not in card]
          if missing:
              raise SystemExit(f"dataset card contract missing: {missing}")

          print("Validated five Viewer configurations, provenance, and privacy boundaries")
          PY

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish dataset to Hugging Face
        env:
          HF_OIDC_RESOURCE: datasets/sauravsingla08/VertiMosaic-VFL-Benchmark
        run: |
          hf upload datasets/sauravsingla08/VertiMosaic-VFL-Benchmark hf-dataset . \
            --commit-message "Sync VertiMosaic VFL benchmark from GitHub ${GITHUB_SHA::7}"
