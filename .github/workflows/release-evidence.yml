# SPDX-License-Identifier: Apache-2.0
name: Release evidence

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release-evidence.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional immutable release tag to reproduce and attach evidence for"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select immutable release source
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$EVENT_REF" == refs/tags/* ]]; then
            tag="$EVENT_REF_NAME"
          fi
          if [[ -z "$tag" && "$EVENT_REF" == "refs/heads/main" ]]; then
            version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
            tag="v${version}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid or missing release tag: $tag" >&2
            exit 1
          fi
          git rev-parse "refs/tags/${tag}^{commit}" >/dev/null
          git checkout --force "refs/tags/${tag}"
          source_sha="$(git rev-parse HEAD)"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Reproducing immutable release $tag at $source_sha"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact reproduction environment
        run: |
          python -m pip install --upgrade pip
          pip install -r reproducibility/requirements-py312.lock
          # ucimlrepo 0.0.6 imports certifi but its published metadata does not
          # reliably pull it into this historical pinned environment. Keep the
          # release rerun deterministic even when reproducing an immutable tag
          # whose lock predates the explicit certifi pin.
          pip install certifi==2026.7.22
          pip install -e . --no-deps
      - name: Run reproducible CPU evidence pipeline
        run: python scripts/reproduce_paper.py --smoke
      - name: Build formal four-protocol benchmark matrix
        run: |
          vertimosaic-benchmark-matrix \
            --rows 800 \
            --seed 42 \
            --no-robustness \
            --logistic-max-iter 150 \
            --gbdt-estimators 8 \
            --output benchmarks/formal_comparison.csv
      - name: Measure separate-process serialized remote transport
        run: >-
          vertimosaic-remote-benchmark
          --messages 20 --vector-size 4096 --seed 42
          --output benchmarks/remote_transport.json
      - name: Build install/environment reproduction bundle
        run: |
          vertimosaic-reproduce \
            --rows 800 \
            --seed 42 \
            --logistic-max-iter 150 \
            --gbdt-estimators 8 \
            --output release-evidence/reproduction
      - name: Run empirical privacy audit
        run: python scripts/run_privacy_audit.py --rows 1200 --seed 42 --output reports/privacy_audit.json
      - name: Run advanced protocol-message privacy audit
        run: >-
          vertimosaic-advanced-privacy-audit
          --rows 1200 --seed 42
          --output reports/advanced_privacy_audit.json
      - name: Run full multi-seed privacy research
        run: >-
          python scripts/run_privacy_research.py
          --output reports/privacy_research.json
          --csv reports/privacy_research_summary.csv
      - name: Record exact installed environment
        run: |
          mkdir -p release-evidence
          python -m pip freeze --all | LC_ALL=C sort > release-evidence/pip-freeze.txt
          python -VV > release-evidence/python.txt
          printf '%s\n' "$RELEASE_TAG" > release-evidence/release-tag.txt
          printf '%s\n' "$RELEASE_SOURCE_SHA" > release-evidence/release-source-sha.txt
      - name: Build hashed evidence and canonical-result indexes
        run: python scripts/build_release_evidence.py
      - name: Package immutable release evidence
        run: |
          tar -czf vertimosaic-release-evidence.tar.gz \
            release-evidence \
            results reports benchmarks paper/figures paper/tables runs \
            paper/preprint.md reproducibility/requirements-py312.lock 2>/dev/null || \
          tar -czf vertimosaic-release-evidence.tar.gz \
            release-evidence benchmarks reports paper/preprint.md \
            reproducibility/requirements-py312.lock
          sha256sum vertimosaic-release-evidence.tar.gz > vertimosaic-release-evidence.tar.gz.sha256
      - name: Retain canonical measured evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vertimosaic-release-evidence-${{ github.sha }}
          path: |
            vertimosaic-release-evidence.tar.gz
            vertimosaic-release-evidence.tar.gz.sha256
            release-evidence/manifest.json
            release-evidence/canonical-results.json
            release-evidence/pip-freeze.txt
            release-evidence/release-tag.txt
            release-evidence/release-source-sha.txt
            benchmarks/
            reports/
            results/
            paper/figures/
            paper/tables/
            paper/preprint.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release assets for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            vertimosaic-release-evidence.tar.gz \
            vertimosaic-release-evidence.tar.gz.sha256 \
            release-evidence/manifest.json \
            release-evidence/canonical-results.json \
            release-evidence/pip-freeze.txt \
            release-evidence/release-tag.txt \
            release-evidence/release-source-sha.txt \
            benchmarks/formal_comparison.csv \
            benchmarks/formal_comparison.json \
            benchmarks/formal_comparison.md \
            benchmarks/remote_transport.json \
            reports/privacy_audit.json \
            reports/advanced_privacy_audit.json \
            reports/privacy_research.json \
            reports/privacy_research_summary.csv \
            paper/preprint.md
