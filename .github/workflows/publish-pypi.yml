name: Publish VertiMosaic to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, attest, publish, and release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vertimosaic
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}" >&2
            exit 1
          fi

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Generate Sigstore-backed GitHub provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Create GitHub release for Zenodo archival
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 0
          fi
          cat > /tmp/release-notes.md <<EOF
          ## VertiMosaic ${TAG}

          PyPI release of VertiMosaic, a CPU-first vertical federated learning research framework for heterogeneous tabular data.

          - Install: \`pip install vertimosaic\`
          - Hugging Face Dataset: https://huggingface.co/datasets/sauravsingla08/VertiMosaic-VFL-Benchmark
          - Hugging Face Space: https://huggingface.co/spaces/sauravsingla08/VertiMosaic
          - Source: https://github.com/sauravsingla/VertiMosaic
          - Build provenance: GitHub artifact attestation for wheel and source distribution

          The GitHub release is created after successful PyPI publication so a connected Zenodo repository can archive the released source version.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "VertiMosaic ${TAG}" \
            --notes-file /tmp/release-notes.md
