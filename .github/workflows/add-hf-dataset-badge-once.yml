name: Add Hugging Face dataset badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hf-dataset-badge-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Hugging Face dataset badge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          url = 'https://huggingface.co/datasets/sauravsingla08/VertiMosaic-VFL-Benchmark'
          badge = (
              '  <a href="' + url + '"><img src="https://img.shields.io/badge/'
              '%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E" alt="Hugging Face Dataset"></a>\n'
          )
          if url not in text:
              marker = '  <a href="LICENSE"><img src="https://img.shields.io/badge/License-Apache--2.0-blue" alt="Apache-2.0"></a>\n'
              if marker in text:
                  text = text.replace(marker, marker + badge, 1)
              else:
                  marker = '<p align="center">\n'
                  text = text.replace(marker, marker + badge, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit badge and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-hf-dataset-badge-once.yml
          git add README.md .github/workflows/add-hf-dataset-badge-once.yml
          git diff --cached --quiet || git commit -m "docs: link Hugging Face VFL benchmark dataset"
          git push
