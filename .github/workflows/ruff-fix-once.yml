# SPDX-License-Identifier: Apache-2.0
name: Ruff fix once

on:
  push:
    branches:
      - codex/v0.2-release-hardening
    paths:
      - .github/workflows/ruff-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/v0.2-release-hardening
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Patch known long lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/vertimosaic/experiments/formal_benchmark.py": [
                  (
                      '''    privacy_surface = (\n        "raw features stay party-local; passive parties receive residual-derived signals and send local logits"\n        if model_name == "logistic"\n        else "raw features and numeric split thresholds stay party-local; parties receive target-derived gradient/Hessian signals and routing information is exposed"\n    )''',
                      '''    if model_name == "logistic":\n        privacy_surface = (\n            "raw features stay party-local; passive parties receive residual-derived "\n            "signals and send local logits"\n        )\n    else:\n        privacy_surface = (\n            "raw features and numeric split thresholds stay party-local; parties receive "\n            "target-derived gradient/Hessian signals and routing information is exposed"\n        )''',
                  ),
              ],
              "src/vertimosaic/privacy/crypto.py": [
                  (
                      '''            "inputs subject to the upstream implementation's threat model, not VFL training messages"''',
                      '''            "inputs subject to the upstream implementation's threat model, not VFL "\n            "training messages"''',
                  ),
              ],
              "src/vertimosaic/transport/remote.py": [
                  (
                      '''            "round_trip_p50_seconds": float(np.percentile(latencies, 50)) if len(latencies) else 0.0,''',
                      '''            "round_trip_p50_seconds": (\n                float(np.percentile(latencies, 50)) if len(latencies) else 0.0\n            ),''',
                  ),
                  (
                      '''            "round_trip_p95_seconds": float(np.percentile(latencies, 95)) if len(latencies) else 0.0,''',
                      '''            "round_trip_p95_seconds": (\n                float(np.percentile(latencies, 95)) if len(latencies) else 0.0\n            ),''',
                  ),
                  (
                      '''                            raise RuntimeError("signed request received an unsigned remote response")''',
                      '''                            raise RuntimeError(\n                                "signed request received an unsigned remote response"\n                            )''',
                  ),
                  (
                      '''            raise RuntimeError("remote transport retry loop terminated unexpectedly") from last_error''',
                      '''            raise RuntimeError(\n                "remote transport retry loop terminated unexpectedly"\n            ) from last_error''',
                  ),
              ],
              "tests/test_crypto_backends.py": [
                  (
                      '''def test_optional_psi_backend_fails_closed_without_dependency(monkeypatch: pytest.MonkeyPatch) -> None:''',
                      '''def test_optional_psi_backend_fails_closed_without_dependency(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:''',
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected lint target not found in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize with Ruff
        run: |
          python -m pip install "ruff==0.16.9"
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Normalize v0.2 hardening code with Ruff"
          git push origin HEAD:codex/v0.2-release-hardening
