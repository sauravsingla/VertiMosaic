name: Add Hugging Face Space badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hf-space-badge-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Add Live Space badge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          badge = '  <a href="https://huggingface.co/spaces/sauravsingla08/VertiMosaic"><img src="https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Live%20Space-FFD21E" alt="Hugging Face Space"></a>'
          if badge not in text:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if 'huggingface.co/datasets/sauravsingla08/VertiMosaic-VFL-Benchmark' in line:
                      lines.insert(index + 1, badge)
                      break
              else:
                  raise SystemExit('Hugging Face Dataset badge not found')
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit badge and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-hf-space-badge-once.yml
          git add README.md
          git commit -m "docs: add VertiMosaic Hugging Face Space badge"
          git push
