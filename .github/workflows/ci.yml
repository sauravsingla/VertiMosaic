# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Show Ruff import fix
        run: ruff check --fix --diff tests/test_privacy_research.py || true
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/vertimosaic
      - name: Full test suite with coverage report
        run: make coverage
      - name: Protocol-critical coverage gate (>=90%)
        run: make coverage-protocol
      - run: vertimosaic demo --rows 2000 --seed 42
      - name: Complete CPU paper smoke pipeline
        if: matrix.python-version == '3.12'
        run: python scripts/reproduce_paper.py --smoke
      - name: Empirical privacy audit smoke
        if: matrix.python-version == '3.12'
        run: python scripts/run_privacy_audit.py --rows 240 --seed 42 --output reports/privacy_audit.json
      - name: Multi-factor privacy research smoke
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/run_privacy_research.py --smoke
          --output reports/privacy_research.json
          --csv reports/privacy_research_summary.csv
      - name: Retain measured smoke and publication evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vertimosaic-smoke-evidence-py312
          path: |
            results/
            reports/
            benchmarks/
            paper/figures/
            paper/tables/
            runs/
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 30
      - run: python -m build
      - run: twine check dist/*
