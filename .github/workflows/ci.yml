name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/vertimosaic
      - run: pytest -q --cov=vertimosaic --cov-report=term-missing
      - run: vertimosaic demo --rows 1000 --seed 42
      - name: Complete CPU paper smoke pipeline
        if: matrix.python-version == '3.12'
        run: python scripts/reproduce_paper.py --smoke
      - run: python -m build
      - run: twine check dist/*
