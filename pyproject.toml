[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertimosaic"
version = "0.1.0"
description = "Cross-industry vertical federated learning for tabular data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Saurav Singla"}]
keywords = ["vertical-federated-learning", "federated-learning", "tabular", "privacy", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "pydantic>=2.6,<3",
  "pyarrow>=15,<25",
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
data = ["ucimlrepo>=0.0.7,<1"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "twine>=5,<7",
  "cyclonedx-bom>=5,<7",
]

[project.scripts]
vertimosaic = "vertimosaic.cli:app"

[project.urls]
Homepage = "https://github.com/sauravsingla/VertiMosaic"
Repository = "https://github.com/sauravsingla/VertiMosaic"
Issues = "https://github.com/sauravsingla/VertiMosaic/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/vertimosaic"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
