[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vertimosaic"
version = "0.1.0"
description = "CPU-first vertical federated learning research framework for heterogeneous tabular data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Saurav Singla"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "pydantic>=2.6,<3",
  "pyarrow>=15,<22",
  "psutil>=5.9,<8",
  "ucimlrepo>=0.0.6,<1",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.7,<5",
  "cyclonedx-bom>=4,<7",
]

[project.scripts]
vertimosaic = "vertimosaic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vertimosaic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vertimosaic"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["vertimosaic"]
branch = true
