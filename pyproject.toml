[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "vertimosaic"
version = "0.2.0"
description = "CPU-first vertical federated learning research framework for heterogeneous tabular data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Saurav Singla"}]
keywords = [
  "vertical federated learning",
  "federated learning",
  "privacy-preserving machine learning",
  "tabular data",
  "distributed machine learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "pydantic>=2.6,<3",
  "pyarrow>=23.0.1,<26",
  "psutil>=5.9,<8",
  "ucimlrepo>=0.0.6,<1",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/sauravsingla/VertiMosaic"
Repository = "https://github.com/sauravsingla/VertiMosaic"
Issues = "https://github.com/sauravsingla/VertiMosaic/issues"
Dataset = "https://huggingface.co/datasets/sauravsingla08/VertiMosaic-VFL-Benchmark"
Space = "https://huggingface.co/spaces/sauravsingla08/VertiMosaic"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0.12,<7",
  "build>=1.2,<2",
  "twine>=5,<7",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.7,<5",
  "cyclonedx-bom>=4,<7",
]
privacy-crypto = [
  "openmined-psi>=2.0.6,<3",
  "pailliers>=0.3.1,<0.4",
]

[project.scripts]
vertimosaic = "vertimosaic.cli:app"
vertimosaic-reproduce = "vertimosaic.reproducibility.independent:main"
vertimosaic-benchmark-matrix = "vertimosaic.experiments.formal_benchmark:main"
vertimosaic-linked-uci = "vertimosaic.experiments.linked_uci_credit:main"
vertimosaic-linked-movielens = "vertimosaic.experiments.linked_movielens:main"
vertimosaic-remote-benchmark = "vertimosaic.experiments.remote_benchmark:main"
vertimosaic-advanced-privacy-audit = "vertimosaic.experiments.advanced_privacy_audit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vertimosaic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
packages = ["vertimosaic"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["vertimosaic"]
branch = true
